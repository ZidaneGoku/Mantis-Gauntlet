<style>
:root{--bg:#efe6d2;--panel:#e2d6ba;--ink:#2a1e12;--dim:#665440;--accent:#276a5f;--amber:#9a5a14;--line:#8a6b45;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f1a;--panel:#181a2a;--ink:#e8dcc0;--dim:#9a9078;--accent:#6fcfae;--amber:#e3a653;--line:#4c4a6a}}
:root[data-theme="dark"]{--bg:#0e0f1a;--panel:#181a2a;--ink:#e8dcc0;--dim:#9a9078;--accent:#6fcfae;--amber:#e3a653;--line:#4c4a6a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IM Fell English",Georgia,serif;font-size:1.18rem;line-height:1.65}
main{max-width:42rem;margin:0 auto;padding:1.4rem 1.1rem 3rem}
h1{font-size:2rem;line-height:1.15;margin:.2rem 0 .3rem;font-weight:400;font-style:italic}
.sub{color:var(--dim);margin:0 0 1rem}
.bar{border:2px ridge var(--line);background:var(--panel);padding:.5rem .8rem;font-size:1rem;color:var(--dim)}
.bar div+div{margin-top:.15rem}.bar b{color:var(--amber);font-weight:400}
#scene{margin:1.3rem 0}
#scene h2{font-size:1.45rem;font-weight:400;color:var(--accent);margin:0 0 .6rem;border-bottom:1px dashed var(--line);padding-bottom:.3rem}
#scene p{margin:.8rem 0}
i{color:var(--amber)}
.choices{display:flex;flex-direction:column;gap:.5rem;margin-top:1.3rem}
button{font:inherit;text-align:left;color:var(--ink);background:var(--panel);border:2px outset var(--line);padding:.55rem .9rem;cursor:pointer;border-radius:0}
button:hover{border-style:inset;color:var(--accent)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.glyph{display:block;margin:1rem auto;max-width:100%;color:var(--dim);font-family:monospace;font-size:.8rem;line-height:1.15;white-space:pre;overflow-x:auto;text-align:center}
footer{color:var(--dim);font-size:.95rem;border-top:1px dashed var(--line);padding-top:.8rem;margin-top:2rem}

<body>
<main>
<h1>The Gauntlet and the Mantis</h1>
<p class="sub">The open dream. Go anywhere. Nothing here is wrong.</p>
<div class="bar"><div>Carrying: <b id="inv"></b></div><div>With you: <b id="comp"></b></div></div>
<div id="scene" aria-live="polite"></div>
<footer>✦ marks what the mantis would suggest. He will welcome you whichever way you choose.</footer>
</main>
<script>
const N={c_mantis:'the mantis',c_tobin:'Tobin',c_pip:'Pip',c_sable:'Sable',c_orin:'Orin',c_quill:'Quill',c_lumen:'Lumen',i_gaunt:'the gauntlet',i_bread:'a warm loaf',i_guppies:'a bowl of guppies',i_dump:'moth dumplings',i_honey:'honey loaves',i_seed:'a sky-garden seed',i_chart:'a star chart',i_song:'a glass song',i_shard:'a bright glass shard',i_pearl:'a singing pearl',i_ember:'an ember fruit',i_harp:'a glass-harp',i_lamp:'a homeward lamp',i_graft:'a grafted ember-sprig',i_mirror:'a mirror-leaf',i_cutting:'a cutting from Seedfall',i_feather:'a fire-heron feather',i_amber:'a moth in amber',i_jar:'a jar of homecoming',i_sparks:'a handful of story-sparks',i_lantern:'a hand-painted lantern',i_grain:'a handful of Ines’s grain',i_drawing:'a childhood drawing'};
let S=new Set(['i_gaunt']);
const G={claw:"   __\n  /  \\___\n |  ___   >====\n  \\/   \\_/",tower:"    ______\n   /  []  \\\n  |_[]__[]_|\n  //      \\\\\n //        \\\\\n//          \\\\",ship:"      ,-=====-.\n  ___/  o o o \\___\n <___________________>"};
const B=['Back to your days','kid'],P=['Back to the plain','ground'];
const D={
start:['The gauntlet','You are small, and the gauntlet is yours: carapace browned with age, a curved blade of pincer along its edge, the foreleg of a praying mantis grown to fit a child’s arm. No one can say where it came from.|It is the best thing you own. It feels like it was waiting for you.',[['Begin','kid']],'claw'],
kid:['Long days','The days are long and the gauntlet is on your arm. What will today be?',[['Play in the tall grass','field'],['Show it to the other children','yard'],['Follow the river with it','river'],['Hold it to your ear and listen','listen'],['Let the years go by','years']]],
field:['The tall grass','You fight invisible monsters until dusk. The blade whispers through the stalks as if it knows the moves. You win every time.',[B]],
yard:['Show and tell','Children crowd around. Tobin, who lives two doors down, asks to hold it. He turns it over with great care. <i>“You’re the luckiest person I know.”</i> You think maybe you are.',[B]],
river:['The river','You wade where the reeds grow thick. The blade parts them cleanly, and a heron watches you pass without alarm. Animals are calm around the gauntlet.',[B]],
listen:['The hum','Against your ear the carapace carries a faint chirr, like a voice very far away, saying something kind and unfinished. You decide not to tell anyone.',[B]],
years:['The years','Seasons turn. You grow tall, and the gauntlet is no longer a toy, but you never put it away. It browns a little more each year.',[['Settle into village life','village'],['Take to the road alone','dusk']]],
village:['The village','Bread-smell in the morning, the mill wheel turning, Tobin calling across the square.',[['Visit Ines at the bakery','bakery'],['Walk out on the evening road','dusk']]],
bakery:['The bakery','Ines hands you a warm loaf and won’t take coin. <i>“For the road you keep looking at.”</i>',[['Take the evening road','dusk','+i_bread']]],
dusk:['A stranger on the road','At dusk a figure steps from the trees: tall, green-gold, mantis-limbed, and unmistakably a person. His eyes are calm and seem to take in everything you feel.|He sees your gauntlet. <i>“That came from one of my people. It was taken when the one who wore it was killed.”</i>',[['Touch the gauntlet again','touch'],['Hold it out to him','give'],['Pull your arm away','defend']]],
touch:['The weight','It feels different now. Grief pours out of the carapace: the sorrow of the one it belonged to, and your own for every happy hour you spent with it. You are heartbroken, and so sorry you ever loved it.',[['Say you are sorry','comfort']]],
give:['Offered','You hold it out with both hands. <i>“Not yet,”</i> he says. <i>“Feel it as it is.”</i> When you do, sorrow floods in, for the one who wore it, and for your joy in it.',[['Say you are sorry','comfort']]],
defend:['Pulled away','Your arm jerks back. It is yours; it is the best thing you have ever had. He only waits. After a long moment you feel the weight under the shine, and shame rushes in.',[['Say nothing yet','comfort']]],
comfort:['All is as it is','He steps closer, never touching without asking. <i>“You were young and glad. There is nothing wrong with delight. The gauntlet carries a hard story and a happy one, and both are true.”</i>|You feel safe. You may keep it, return it, or set it down, he tells you, and he will walk with you whatever you choose.',[['Walk on with him toward the great tower','ground','+c_mantis']]],
ground:['The foot of the tower','A vast plain, and in its center the tower: a dome of windows, lobbies and homes propped on four colossal escalator legs that climb into the clouds. Below it stand a market, a river and a field of stones.|<i>“Go where you like,”</i> says the mantis. <i>“I’ll be here.”</i>',[['Visit Footfall Market','market'],['Walk down to the river','ferry'],['Visit the field of stones','cairn'],['Go back for Tobin','fetch','','!c_tobin'],['✦ Ride the escalator','ride']],'tower'],
fetch:['Tobin’s door','Tobin opens the door, startled, not smiling. <i>“I thought you’d gone.”</i> It stings more than you expected.|But you tell him about the tower and the mantis, and the old grin comes back. By the time you reach the plain he is himself again.',[['Return to the tower','ground','+c_tobin']]],
market:['Footfall Market','Odalys sells provisions from a cart hung with lanterns. <i>“Take what you’ll want on a long road.”</i>',[['A fishbowl of guppies','ground','+i_guppies','!i_guppies'],['Moth dumplings','ground','+i_dump','!i_dump'],['Honey loaves','ground','+i_honey','!i_honey'],P]],
ferry:['The ferry','Pip, a child no older than you once were, poles a ferry across the slow river. <i>“Nobody goes up there,”</i> she says, nodding at the tower. <i>“They say you can see the stars from the top.”</i>',[['Invite Pip along','ground','+c_pip','!c_pip'],['Ride across and back with her','ferry2'],P]],
ferry2:['Across the water','The river is slow and brown and kind. Pip tells you every fish she has ever named. When you part she says: <i>“If you go up, tell the stars I said hello.”</i>',[['Return to the plain','ferry']]],
cairn:['The field of stones','Thousands of small cairns, each laid by someone for someone killed. Wind combs the grass. The mantis stops at the edge. <i>“Come as you wish.”</i>',[['Leave the gauntlet among the stones','left','-i_gaunt','i_gaunt'],['Sit with the mantis and add a stone','stone'],P]],
left:['Set down','You lay it among the stones. The wind pauses. <i>“It will be remembered,”</i> says the mantis. <i>“And you are no less welcome.”</i> You feel lighter, and a little lost.',[P]],
stone:['A stone','You place a small stone and think: I’m sorry, and thank you. The wind answers, or seems to.',[P]],
ride:['The long climb','You step onto the escalator with {crew}. The plain shrinks to a quilt, then to a rumor. An hour passes, and then more. The steps hum under your feet.',[['Stop at the midway landing','landing'],['Ride straight to the top','lobby'],['Ride back down','ground']]],
landing:['The midway landing','A platform in the clouds with a tea stall. Merrin pours without hurry. Sable, a moth-winged musician, tunes a small harp by the rail. <i>“I always wanted to see past the top,”</i> she says.',[['Have tea and listen to Sable play','tea'],['Invite Sable along','landing','+c_sable','!c_sable'],['Continue up','lobby']]],
tea:['Tea in the clouds','The tea tastes of smoke and pear. Sable’s music makes the clouds seem to lean in. For a while there is no up or down.',[['Back to the platform','landing']]],
lobby:['The dome','Doors open on a lobby of gold light: windows, restaurants, rooms for living. Through the glass, a great ship glides in and docks at the far arm.|<i>“Everything here is yours to wander,”</i> says the mantis.',[['The restaurant','diner'],['The sky garden','garden'],['The observatory','obs'],['The living quarters','rooms'],['The docking arm','dock'],['Ride back down','ground']],'ship'],
diner:['The restaurant','A round restaurant above the clouds. The cook asks only what you are hungry for.',[['A fishbowl of guppies for the table','eat_g'],['Starlight noodles','eat_n'],['Moth dumplings','eat_m'],['Just tea','lobby']]],
eat_g:['Guppies','One meal arrives, made for {crew} to share: a fishbowl of guppies, swimming. Strange alien food, but all of you can eat it. It tastes cold and clean, and it is somehow enough.',[['Back to the dome','lobby']]],
eat_n:['Starlight noodles','Pale glowing noodles, long enough to pass from hand to hand. {crew} laugh trying to eat them politely.',[['Back to the dome','lobby']]],
eat_m:['Moth dumplings','Dumplings that crunch like autumn and taste like honey. The mantis eats three, solemnly, then a fourth.',[['Back to the dome','lobby']]],
garden:['The sky garden','Glass terraces climb in tiers. Orin tends a bed of luminous ferns and glances at the gauntlet. <i>“Old things grow roots too.”</i>',[['Accept a seed','garden','+i_seed','!i_seed'],['Invite Orin along','garden','+c_orin','!c_orin'],['Leave','lobby']]],
obs:['The observatory','Quill, an old cartographer, hunches at a brass telescope. <i>“Hollow Reach,”</i> they murmur, looking at the mantis. <i>“A long way. Take this.”</i>',[['Take the star chart','obs','+i_chart','!i_chart'],['Ask Quill to come','obs','+c_quill','!c_quill'],['Look through the telescope','scope'],['Leave','lobby']]],
scope:['Through the lens','Stars crowd the glass, each a possible world. The mantis names three softly, and you hear the longing under the names. He would never ask.',[['Back','obs']]],
rooms:['The quarters','Quiet corridors of warm wooden doors. One stands open, waiting.',[['Sleep for the night','sleep'],['Back to the lobby','lobby']]],
sleep:['A night in the dome','You dream of a gauntlet and a mantis, and the mantis is walking beside you. You wake rested; he sits by the window, awake. <i>“Nothing needs deciding before breakfast.”</i>',[['Rise','lobby']]],
dock:['The ship','The Long Patience rests in her cradle, silver-green and ribbed like a leaf, ramp open. <i>“She won’t leave for days,”</i> says the mantis. <i>“Go when you wish, or never. I’d think it better to stay and do the work that’s yours, but that is only my thought.”</i>',[['✦ Go back down to the people who need you','ground'],['Dine aboard first','galley'],['Board and leave now','launch'],['Make your home in the dome','end_dome'],['Back to the lobby','lobby']],'ship'],
galley:['The galley','A long table, one meal brought, made for {crew}: honey broth and bright small fish. The ship hums at the dock.',[['Back to the ramp','dock']]],
launch:['Departure','The ramp folds. The tower falls away like a candle seen from a train. Aboard: {crew}.|<i>“Where shall we go?”</i> asks the mantis. <i>“I’ll go anywhere with you.”</i>',[['Walk the ship first','ship'],['Open the star map','space']],'ship'],
space:['The star map','Stars drift past the windows. The mantis spreads the map and waits.',[['✦ Glass Moor','glass'],['The Brine Choir','brine'],['Ember Orchard','ember'],['Hollow Reach, where the mantis was born','hollow','','i_chart'],['Mirror Fen','fen','','f_fen'],['Walk the ship','ship'],['Drift between the stars','drift'],['Return to Earth','home']]],
glass:['Glass Moor','The ship settles on a plain of standing glass, each blade tall as a pine, ringing in the wind like a harp. Slow beings of glass drift between them, humming.',[['Walk among them','glass2'],['Let the gauntlet ring against a blade','glass2','+i_song','i_gaunt'],['Back to the stars','space']]],
glass2:['The Harpers','A Harper bends close, its face a slow prism. It sings a phrase and waits. You sing something back, badly, and it seems delighted.',[['Learn their song','space','+i_song','!i_song'],['Trade your loaf for a shard','space','-i_bread,+i_shard','i_bread'],['Follow them to their hall','glass3','','i_song'],['Say goodbye','space']]],
brine:['The Brine Choir','An ocean from horizon to horizon, grey-green, and the water is singing: slow low notes rolling beneath the ship.',[['Sail out onto the swell','brine2'],['Stay aboard and listen','space']]],
brine2:['The singing deep','A leviathan surfaces, vast and gentle. Its song asks a question you almost understand.',[['Sing back','space','+i_pearl','!i_pearl'],['Offer it the guppies','space','-i_guppies,+i_pearl','i_guppies'],['Dive with the leviathan into the deep','brine3','','i_pearl'],['Just listen','space']]],
ember:['Ember Orchard','A black-glass world of fruit trees that burn like lanterns. A heat storm rolls toward the ship.',[['Cut a firebreak with the gauntlet’s blade','ember2','','i_gaunt'],['Shelter in the ship until it passes','ember2'],['Plant the seed to cool the soil','ember2','','i_seed']]],
ember2:['After the storm','The storm breaks and passes, leaving the orchard glowing. A tree bows a branch and offers a fruit, warm as a hand. You have overcome something, even if it was only waiting.',[['Take the fruit','ember3','+i_ember']]],
hollow:['Hollow Reach','Towers of grown amber over a green sea. Mantis-folk line the shore in silence; they have waited a very long time. The mantis steps down and bows his head.',[['Show them the gauntlet','hollow_g','','i_gaunt'],['Greet them with empty hands','hollow_n','','!i_gaunt']]],
hollow_g:['The gauntlet returns','An elder takes it in both hands. <i>“It was Ahn-Teru’s,”</i> she says. <i>“She would be glad it was loved.”</i> She offers it back, or a place for it among the amber.',[['Return it, with thanks','hollow_e','-i_gaunt,+f_ahn'],['Keep it','hollow_e','+f_ahn']]],
hollow_n:['Empty hands','Elders touch your hands. <i>“We know what you left among the stones. It was a good place. You will always be welcome.”</i>',[['Continue','hollow_e']]],
hollow_e:['Lanterns','The shore lights lanterns for the one who wore it. A young mantis, Lumen, tugs your sleeve. <i>“Can I see the stars with you?”</i>',[['Welcome Lumen aboard','hollow_e','+c_lumen','!c_lumen'],['Visit the amber library','hall'],['Sit by the elder’s fire','kin'],['Take to the stars again','space']]],
home:['Earth below','Blue and small and yours. <i>“It is a good place to be from,”</i> says the mantis, <i>“and to come back to.”</i>',[['Land in your village','end_home'],['Land at the tower','lobby'],['Turn back to the stars','space']]],
end_home:['Home','The ship settles in the square where you grew up. Villagers gather. Ines hands you a warm loaf, as if no time has passed. {crew} are welcomed and fed, and the mantis stands among them, unhurried.',[['Visit the field of stones','return_stone','','f_ahn'],['Sit with Tobin and Ines at the table','table'],['Go out again','space'],['Stay','end_stay']]],
end_dome:['A home in the sky','You make a life in the tower’s golden light. The mantis keeps the room beside yours. Some evenings you watch ships come and go, and wave.',[['Walk the dream again','start'],['Slip back out into the lobby','lobby']]],
end_stay:['Staying','You are home. The stars wait, patient, and the mantis sits with you on the porch. Both things are true.',[['Walk the dream again','start'],['Set out again','space']]],
ship:['Inside the Long Patience','Warm corridors of pale ribbed wood hum with the engine’s slow heartbeat. Doors open wherever you want to go.',[['The bridge','bridge'],['The garden hold','hold'],['The mess','mess'],['The gallery, where everyone gathers','gather'],['Back to the star map','space']]],
bridge:['The bridge','A curved window, a living chart of light, and a helm shaped to a mantis hand. <i>“Place your hand beside mine,”</i> says the mantis. The ship leans where you lean.',[['Take the helm and drift','drift'],['Ask where the ship got her name','name'],['Back','ship']]],
name:['The ship’s name','<i>“She was grown from a seed in my grandmother’s garden, and the first thing she learned was to wait.”</i> He tells you his name is Seru, though he has never needed it spoken. <i>“Use it or not. Either is a kindness.”</i>',[['Back to the bridge','bridge','+f_name']]],
hold:['The garden hold','A warm green hold in the ship’s belly, with beds of black soil and a window onto the dark.',[['Plant the sky-garden seed','sprout','+f_garden,-i_seed','i_seed'],['Graft the ember fruit onto the sprout','graft','+i_graft,-i_ember','f_garden,i_ember'],['Eat from the grafted branch','fruit','','i_graft'],['Back','ship']]],
sprout:['A shoot','The seed takes at once. By the next star a pale shoot leans toward you. If Orin is aboard, he hums to it.',[['Back to the hold','hold']]],
graft:['Grafted','You bind the ember fruit’s stem to the shoot, as Cinder taught. The leaves flush gold. Something here will bear fruit, warm and slow.',[['Back to the hold','hold']]],
fruit:['The warm fruit','Sweetness, then warmth, then a feeling that everyone you have met is a little closer than they were. The mantis closes his eyes.',[['Back to the hold','hold']]],
mess:['The mess','A long table with a bench for each of you. {crew} cook together from what you carry: honey, dumplings, whatever the hold gave. Everyone talks over each other, and the mantis is quiet and happy.',[['Back','ship']]],
gather:['The gallery','A curved room of window. Stars pass like slow snow. Everyone aboard drifts here sooner or later.',[['Sit with the mantis','talk_m'],['Sit with Tobin','talk_t','','c_tobin'],['Sit with Pip','talk_p','','c_pip'],['Sit with Sable','talk_s','','c_sable'],['Sit with Orin','talk_o','','c_orin'],['Sit with Quill','talk_q','','c_quill'],['Sit with Lumen','talk_l','','c_lumen'],['Back','ship']]],
talk_m:['The mantis speaks','<i>“I was not sent to find you,”</i> he says. <i>“I was walking home from a long grief, and yours was the road I took.”</i> You sit with him until the stars change.',[['Ask what he grieves','talk_m2'],['Sit in silence','gather']]],
talk_m2:['Ahn-Teru','<i>“A gardener. She gave seeds to strangers, and was killed on a road for a coat of shell.”</i> He does not ask you to feel anything. That is why you do.',[['Back to the gallery','gather','+f_ahn']]],
talk_t:['Tobin','<i>“I always wanted to be brave like you,”</i> Tobin says. <i>“Turns out I just wanted to be near something that wasn’t afraid.”</i> He wants to see a real horizon someday.',[['Back to the gallery','gather']]],
talk_p:['Pip','Pip names the stars wrong on purpose, then right. <i>“What does the ocean sound like when it sings?”</i> You promise to find out together.',[['Back to the gallery','gather','+f_pipwish']]],
talk_s:['Sable','Sable plays a tune she never finished. <i>“It wants a second voice.”</i> If you carry a glass song, you hum it, and the tune leans toward it like a plant to light.',[['Back to the gallery','gather']]],
talk_o:['Orin','Orin shows you how to listen to a root. <i>“Everything old is still growing underneath. Even grief. Especially grief.”</i> He asks for a bed in the hold.',[['Back to the gallery','gather']]],
talk_q:['Quill','Quill is drawing the voyage so far, in ink that shifts with the light. In one corner is your village, small and warm. <i>“A map should always have a way home on it.”</i>',[['Back to the gallery','gather']]],
talk_l:['Lumen','Lumen asks about the thing you carry, or once carried. <i>“Is it sad?”</i> You think. <i>“I think it is remembering,”</i> says Lumen, and falls asleep against the mantis.',[['Back to the gallery','gather']]],
drift:['Between the stars','You let the ship drift. The engine slows to a hum and the dark is not frightening with the mantis beside you.',[['Follow a faint, steady light','lighthouse'],['Follow a trail of sparks','comet'],['Drift in silence','silence'],['Back to the star map','space']]],
silence:['Silence','Hours pass. Nothing happens, and it is the best thing that has happened. Everyone aboard sleeps well.',[['Wake','space']]],
lighthouse:['The lighthouse at nowhere','A white tower on a rock of ice, its lamp turning for no one. Wick, its keeper, a patient thing of brass and lantern-glass, waves. <i>“Ships so seldom come. Tea?”</i>',[['Have tea and hear its story','light2'],['Accept the lamp it offers','lighthouse','+i_lamp,+f_fen','!i_lamp'],['Leave','space']]],
light2:['Wick’s story','<i>“I keep the light for anyone who has lost the way home. No one has come who was lost, only far.”</i> It seems content with that. It says the lamp points to Mirror Fen, where lost things look back.',[['Back','lighthouse']]],
comet:['The comet market','A comet trails a bazaar of stalls on silk cables. Brindle, a many-armed trader, rubs every hand together. <i>“I take stories, fruit or glass.”</i>',[['Tell Brindle the story of the gauntlet','story','','!i_mirror'],['Trade a shard for a harp','comet','-i_shard,+i_harp','i_shard'],['Leave','space']]],
story:['A story for a leaf','Brindle listens without once bargaining. At the end the many hands go still. <i>“Good stories are always overpaid.”</i> A mirror-leaf is pressed into your palm.',[['Back to the market','comet','+i_mirror']]],
fen:['Mirror Fen','Shallow silver water to the horizon, and every reflection is somewhere else. In the glass, a child with a browned gauntlet plays in tall grass, and does not see you.',[['Call to the child gently','fen2'],['Watch from a distance','fen3'],['Step through the water','fen4','','i_mirror']]],
fen2:['A word to the child','The child turns. You tell them it will grow heavy someday, and that they will be forgiven. They nod as if they already knew, and go back to the game.',[['Return to the ship','space','+f_forgiven']]],
fen3:['Watching','You watch them fight invisible monsters until dusk, and love them, and say nothing. It is its own kind of kindness.',[['Return to the ship','space']]],
fen4:['Through the leaf','The mirror-leaf steadies your steps. You sit with the child in the grass and show them how to hold the blade so it harms no one. They laugh. In a reflection nearby, the mantis smiles.',[['Return to the ship','space','+f_forgiven']]],
glass3:['The Harpers’ hall','A cathedral of grown glass where the sky is one note held a thousand years. They ask for your song.',[['Let Sable play with them','glass4','','c_sable'],['Sing alone','space'],['Listen quietly','space']]],
glass4:['A tune completed','Sable’s unfinished tune meets the Harpers’ long note and closes like a door into a warm house. A Harper gives her a glass-harp, and she weeps happily.',[['Back to the ship','space','+i_harp']]],
brine3:['The deep','The leviathan carries the ship beneath the surface, lit from below by creatures like lanterns. It sings your name wrongly and warmly.',[['Let Pip sing to it','brine4','','c_pip,f_pipwish'],['Stay silent in the glow','space']]],
brine4:['Pip sings','Pip sings every wrong star-name she knows. The leviathan laughs, a bell ringing underwater. She cries a little, happily, and the deep lifts you home.',[['Rise to the surface','space']]],
ember3:['The orchard keeper','A tall woman with bark for skin, Cinder, tends the trees. She sees the fruit in your hand. <i>“Warm things want to be shared.”</i>',[['Ask how the fire orchard grows','ember4'],['Thank her and go','space']]],
ember4:['Cinder’s lesson','<i>“Bind fruit to a sky-seed’s shoot and it will carry fire without burning. You need soil that travels.”</i> You think of the ship.',[['Back to the stars','space']]],
hall:['The amber library','Tall walls of amber with small lives held in them like thoughts: a seed, a note, a feather. An archivist bows. <i>“Ahn-Teru’s shelf is by the window.”</i>',[['Read her shelf','hall2'],['Back','hollow_e']]],
hall2:['Her notebooks','Pages of seeds drawn, named and given away. The last page is blank, with a pressed leaf. <i>“She would want it filled by someone who gives things away.”</i>',[['Write a line and leave a seed','hall3','-i_seed','i_seed'],['Write only a line','hall3']]],
hall3:['A line in amber','You write one line. The amber warms around it, and for a moment someone seems to be reading over your shoulder.',[['Back','hollow_e','+f_ahn']]],
kin:['The elder’s fire','The elder speaks in clicks, and the mantis translates through wet eyes. <i>“She says I took a long road home. She says you were part of it.”</i>',[['Back','hollow_e']]],
return_stone:['A stone for Ahn-Teru','In the field of stones you find a bare patch and lay a stone there, with a seed if you have one. The mantis says a shoot will come by morning. He is right.',[['Back to the village','end_home']]],
table:['The table','Ines sets out bread. Tobin tells the whole story too loudly and wrongly. {crew} laugh in lamplight, the old kind, and no one is in a hurry.',[['Stay at the table','end_home']]],
space:['The star map','Stars drift past the windows. The mantis spreads the map and waits.',[['✦ Glass Moor','glass','+v_glass'],['The Brine Choir','brine','+v_brine'],['Ember Orchard','ember','+v_ember'],['Hollow Reach, where the mantis was born','hollow','+v_hollow','i_chart'],['Mirror Fen','fen','+v_fen','f_fen'],['Seedfall','seedfall','','m3'],['The Blank','edge','','q3'],['Walk the ship','ship'],['Drift between the stars','drift'],['Return to Earth','home']]],
drift:['Between the stars','You let the ship drift. The engine slows to a hum and the dark is not frightening with the mantis beside you.',[['Follow a faint, steady light','lighthouse','+v_light'],['Follow a trail of sparks','comet','+v_comet'],['Ride Pip’s ribbon of light','ribbon','','p3'],['Drift in silence','silence'],['Back to the star map','space']]],
end_home:['Home','The ship settles in the square where you grew up. Villagers gather. Ines hands you a warm loaf, as if no time has passed. {crew} are welcomed and fed, and the mantis stands among them, unhurried.',[['Walk out to the lantern field','landing_field','','t3'],['Visit the field of stones','return_stone','','f_ahn'],['Sit with Tobin and Ines at the table','table'],['Go out again','space'],['Stay','end_stay']]],
gather:['The gallery','A curved room of window. Stars pass like slow snow. Everyone aboard drifts here sooner or later.',[['Sit with the mantis','talk_m','','!m1'],['Speak with the mantis again','m2','','m1,f_ahn,v_hollow,!m2'],['Speak with the mantis again','m3','','m2,f_forgiven,!m3'],['Sit with Tobin','talk_t','','c_tobin,!t1'],['Tobin has something on his mind','t2','','c_tobin,t1,v_glass,!t2'],['Tobin has something on his mind','t3','','c_tobin,t2,v_hollow,!t3'],['Sit with Sable','talk_s','','c_sable,!s1'],['Sable is tuning her harp','s2','','c_sable,s1,v_glass,!s2'],['Sable holds the glass-harp','s3','','c_sable,s2,i_harp,!s3'],['Sit with Orin','talk_o','','c_orin,!o1'],['Orin is by the sprout','o2','','c_orin,o1,f_garden,!o2'],['Orin is listening to a branch','o3','','c_orin,o2,i_graft,!o3'],['Sit with Quill','talk_q','','c_quill,!q1'],['Quill has the chart unrolled','q2','','c_quill,q1,i_chart,!q2'],['Quill has ink on their cuffs','q3','','c_quill,q2,v_light,!q3'],['Sit with Pip','talk_p','','c_pip,!p1'],['Pip is quiet on the bench','p2','','c_pip,p1,v_brine,!p2'],['Pip waits at the bridge door','p3','','c_pip,p2,f_name,!p3'],['Sit with Lumen','talk_l','','c_lumen'],['Just sit among everyone','sitall'],['Back','ship']]],
sitall:['Together','You sit among them. Nobody has to speak. Someone’s breathing slows into sleep, and the gallery is warm.',[['Back to the gallery','gather']]],
talk_m:['The mantis speaks','<i>“I was not sent to find you,”</i> he says. <i>“I was walking home from a long grief, and yours was the road I took.”</i> You sit with him until the stars change.',[['Ask what he grieves','talk_m2','+m1'],['Sit in silence','rm1','+m1']]],
rm1:['A gift of quiet','You sit. He lets the silence be a gift. After a while he says: <i>“Most do not know how. Thank you.”</i>',[['Back to the gallery','gather']]],
m2:['His guilt','The mantis is at the window, rubbing the edge of his own forearm blade. <i>“I was away when she died,”</i> he says. <i>“I tell myself I could not have known. I do not always believe myself.”</i>',[['Tell him it was not his fault','rm2','+m2,+m2a'],['Ask what he would say to her','rm2','+m2']]],
rm2:['A little lighter','[[m2a?<i>“Perhaps. I am learning to accept comfort the way I give it,”</i> he says, almost shy.]][[!m2a?He is quiet a long moment. <i>“That I kept her seeds. That I carried them where she would have wanted.”</i> His eyes brighten.]]',[['Back to the gallery','gather']]],
m3:['A road back','He finds you after Mirror Fen. <i>“You forgave a child you once were. I want to try that. There is a place her seeds fell when the road took her. I have never gone back. Will you come?”</i>',[['Say you will go whenever he is ready','rm3','+m3,+m3a'],['Say you will go if he asks again','rm3','+m3']]],
rm3:['Seedfall','[[m3a?He bows his head to you, a gesture kept for elders. <i>“Then the way is open.”</i>]][[!m3a?<i>“I will ask,”</i> he says, and means it.]] He marks a quiet star on the map: Seedfall.',[['Back to the gallery','gather']]],
talk_t:['Tobin','Tobin watches the stars pass. <i>“I always wanted to be brave like you. Turns out I just wanted to be near something unafraid.”</i> His hands tremble on his knees. <i>“Were you ever afraid?”</i>',[['Admit you are afraid all the time','rt1','+t1,+t1a'],['Tell him bravery is only keeping on','rt1','+t1']]],
rt1:['Courage','[[t1a?He laughs, shocked, and relaxes all at once. <i>“Then we’re both cowards, and here we are.”</i> He leans on you.]][[!t1a?He nods slowly. <i>“Keeping on. I can do that.”</i> He sits a little straighter.]] He says he would love to see a real horizon.',[['Back to the gallery','gather']]],
t2:['A horizon','Tobin finds you at the window. <i>“There was a horizon on Glass Moor, and I stood in it and wasn’t small. I want to do something with that. Not leave the village behind, but come back changed.”</i>',[['Tell him to build something for the village','rt2','+t2,+t2a'],['Tell him to keep traveling and see','rt2','+t2']]],
rt2:['A plan, or none','[[t2a?<i>“A lantern field,”</i> he says slowly, eyes bright. <i>“So any ship can find home. Yes.”</i> He sketches it on his sleeve.]][[!t2a?He grins. <i>“No plan. I like that.”</i> He sets out to learn the ship, one door at a time.]]',[['Back to the gallery','gather']]],
t3:['A passenger','After Hollow Reach, Tobin is quiet for a day. <i>“I watched you give something up. I’m not sure I’d have the strength. I’m scared I’m only a passenger in my own life.”</i>',[['A passenger can still choose a stop','rt3','+t3,+t3a'],['Say you will help him find his own thing','rt3','+t3']]],
rt3:['Settled','[[t3a?<i>“Then I choose home,”</i> he says. <i>“I’ll keep the light. Someone has to, and I want it to be me.”</i>]][[!t3a?<i>“Then we find it together,”</i> he says, clasping your arm hard.]] Something in him has settled.',[['Back to the gallery','gather']]],
talk_s:['Sable','Sable plays a tune she never finished. <i>“It wants a second voice.”</i> She looks at you, hopeful and embarrassed.',[['Hum a second voice under her tune','rs1','+s1,+s1a'],['Ask her to play it all the way through','rs1','+s1']]],
rs1:['The hole in the tune','[[s1a?Your voice is terrible and it is exactly what the tune needed. She laughs until she cries.]][[!s1a?She plays; halfway she stops. <i>“It always stops here. That is where something should go.”</i>]] She says the Glass Harpers might know what it wants.',[['Back to the gallery','gather']]],
s2:['No audience','Sable listens to the ship’s hum. <i>“I left my caravan because they wanted only the songs that sold. I think I am afraid that without an audience I am nobody.”</i>',[['Tell her you will be her audience','rs2','+s2,+s2a'],['Tell her the song matters without anyone','rs2','+s2']]],
rs2:['Tuning','[[s2a?<i>“Then I will play for you,”</i> she says, tuning. <i>“Tonight. Badly, probably.”</i>]][[!s2a?She holds her harp close. <i>“I want that to be true. I will play to the empty gallery and see.”</i>]]',[['Back to the gallery','gather']]],
s3:['The whole song','Sable holds the glass-harp, and it rings in a color you can almost see. <i>“I think it is time. I want to play the whole thing for everyone aboard. Will you help me gather them?”</i>',[['Gather everyone in the gallery','concert','+s3,+s3a,+f_concert'],['Let her choose her own moment','concert','+s3,+f_concert']]],
concert:['The concert','The gallery fills. {crew} sit in the starlight. Sable plays, and the unfinished tune finishes, soft as a held breath. [[s3a?She looks at you the whole time.]][[!s3a?She plays with her eyes closed, free.]] No one speaks for a long time. The mantis’s eyes are bright, and the ship hums a harmony.',[['Back to the gallery','gather']]],
talk_o:['Orin','Orin shows you how to listen to a root. <i>“Everything old is still growing underneath. Even grief.”</i> He asks: <i>“Have you ever grown anything?”</i>',[['Say you grew up beside a river, nothing more','ro1','+o1'],['Say you fear you would kill whatever you grow','ro1','+o1,+o1a']]],
ro1:['Careful hands','[[o1a?<i>“Good. Fear makes careful hands. A gardener without fear is only a harvester.”</i>]][[!o1a?<i>“A river grows things in its own way. We will start there.”</i>]] He asks for a bed in the hold.',[['Back to the gallery','gather']]],
o2:['The garrison','By the sprout Orin says: <i>“I was a soldier’s gardener once. They wanted flowers for the dead. I grew them and never asked what they were for.”</i> His hands go still.',[['Tell him he grew a place for grief','ro2','+o2,+o2a'],['Ask what he wishes he had grown','ro2','+o2']]],
ro2:['Thumb in the soil','[[o2a?<i>“A place for grief. Yes. That is truer than I have let it be.”</i>]][[!o2a?<i>“Something that ate.”</i> He smiles thinly. <i>“I think I grow food now to apologize.”</i>]] He presses a thumb into the soil, gently.',[['Back to the gallery','gather']]],
o3:['The root-song','Orin holds the grafted sprig, listening. <i>“I know this root-song. It is in Ahn-Teru’s seeds too. She gave seeds away, and some went farther than she knew.”</i>',[['Ask him to teach you to listen','ro3','+o3,+o3a'],['Ask him to tend it while you keep the ship','ro3','+o3']]],
ro3:['What the bark says','[[o3a?He puts your hand to the bark. Under it something hums, patient and kind. You will not forget it.]][[!o3a?<i>“I would be honored.”</i> He hums, and the leaves answer.]] He thinks the orchard where her seeds fell must still be waiting.',[['Back to the gallery','gather']]],
talk_q:['Quill','Quill is drawing the voyage so far, in ink that shifts with the light. In one corner is your village, small and warm. <i>“A map should always have a way home on it.”</i>',[['Ask what else Quill is drawing','rq1','+q1,+q1a'],['Offer to draw a corner yourself','rq1','+q1']]],
rq1:['Ink','[[q1a?<i>“Everything I have ever seen,”</i> says Quill. <i>“Ink forgets when I do, so I draw faster.”</i>]][[!q1a?You draw your village, badly. <i>“Perfect. Maps should have mistakes. Then they feel lived-in.”</i>]]',[['Back to the gallery','gather']]],
q2:['The blank spaces','Quill spreads the chart. <i>“Old cartographers lie a little. We leave blanks where we are afraid, and I have many.”</i> One gap near the edge is drawn around with great care.',[['Ask what Quill is afraid of','rq2','+q2,+q2a'],['Say blanks are where things get discovered','rq2','+q2']]],
rq2:['A heresy','[[q2a?<i>“Drawing something I cannot come back from,”</i> Quill admits. <i>“I mapped a place once, and it was gone the next day.”</i>]][[!q2a?Quill laughs, dry and bright. <i>“A cartographer’s heresy. I like it.”</i>]]',[['Back to the gallery','gather']]],
q3:['Blind','Quill comes back from the lighthouse changed. <i>“Wick keeps a light for the lost. I think I draw maps to avoid being lost. I would like to draw one place without knowing it first.”</i>',[['Offer to fly there with them','rq3','+q3,+q3a'],['Ask them to draw it first, and you will follow','rq3','+q3']]],
rq3:['A faint line','[[q3a?Quill takes your hand, ink and all. <i>“Then we go in blind, together.”</i>]][[!q3a?They draw a single faint line, and for once do not correct it.]] A new mark glows at the edge of the chart: the Blank.',[['Back to the gallery','gather']]],
talk_p:['Pip','Pip names the stars wrong on purpose, then right. <i>“What does the ocean sound like when it sings?”</i>',[['Say a hundred bells','rp1','+p1,+p1a,+f_pipwish'],['Say you do not know, so find out together','rp1','+p1,+f_pipwish']]],
rp1:['The list','[[p1a?<i>“Bells!”</i> she says like a spell. <i>“I will know them when I hear them.”</i>]][[!p1a?<i>“Together,”</i> she repeats, trying the word on.]] She adds the Brine Choir to a list of places she wants to see.',[['Back to the gallery','gather']]],
p2:['What if','Pip is quiet on the bench. <i>“The ocean was bigger than I thought. Everyone at the ferry said I would never leave. Part of me believed them. What if I am not meant to go back?”</i>',[['Tell her she can go home whenever she likes','rp2','+p2,+p2a'],['Tell her she gets to decide again and again','rp2','+p2']]],
rp2:['Deciding','[[p2a?She breathes out. <i>“Knowing the door is open makes me want to stay in the room.”</i>]][[!p2a?<i>“Again and again,”</i> she says. <i>“That is a lot of deciding. I like it.”</i>]]',[['Back to the gallery','gather']]],
p3:['The helm','Pip stands at the bridge door. <i>“Seru said I could try the helm if you say yes. I poled a ferry my whole life. A ship is just a very big ferry.”</i>',[['Say yes and sit beside her','rp3','+p3,+p3a'],['Say yes and let her fly with the mantis','rp3','+p3']]],
rp3:['Her own sky','[[p3a?The ship leans where she leans. She steers by the song of the current, laughing.]][[!p3a?From the gallery you hear the ship hum a pleased note. She steers well.]] A ribbon of light now shows in the drift.',[['Back to the gallery','gather']]],
ribbon:['The singing current','Pip steers into a ribbon of light that sings in the ship’s ribs. It carries you far in an hour. At the end one pearl floats, as if left for her.',[['Take the pearl','space','+i_pearl','!i_pearl'],['Leave it','space']]],
landing_field:['The lantern field','On the plain beyond the village, Tobin has set lanterns in a great ring, [[t2a?exactly as he sketched on his sleeve]][[!t2a?in a pattern only he understands]]. Any ship can find the way home by it. The mantis says a quiet word to the grass.',[['Back to the village','end_home']]],
seedfall:['Seedfall','A hillside of small green things in a silver dusk. Ahn-Teru’s seeds fell here and grew into a wild orchard of a hundred kinds of fruit. The mantis kneels at the first tree and does not rise for a long while.',[['Kneel beside him','sf2'],['Give him space and walk the rows','sf2']]],
sf2:['She is spread out','The orchard moves in no wind. [[o3?Orin’s voice returns: the root-song is here, everywhere, and it answers.]] [[i_graft?You plant the grafted sprig, and gold leaves turn toward the others.]][[i_seed?You plant your seed at the edge: her gift going on being given.]] <i>“She is not gone,”</i> says the mantis. <i>“She is spread out.”</i>',[['Take a cutting','space','+i_cutting','!i_cutting'],['Leave it whole','space']]],
edge:['The Blank','The edge of the chart is empty. Quill leans at the window. <i>“There is a world here and nobody has named it.”</i> A small green-blue planet turns below, unlabeled.',[['Name it for the child in the fen','edge2','+f_n1'],['Name it for Ahn-Teru','edge2','+f_n2'],['Name it for those aboard','edge2','+f_n3']]],
edge2:['A name','Quill writes the name in glowing ink: [[f_n1?Little Grass]][[f_n2?Ahn’s Rest]][[f_n3?Companions]]. The planet settles into it like a cat into a lap. You land in a small, happy quiet: a place that will be kind to whoever comes next.',[['Back to the ship','space']]],
ship:['Inside the Long Patience','Warm corridors of pale ribbed wood hum with the engine’s slow heartbeat. Doors open wherever you want to go.',[['The bridge','bridge'],['The garden hold','hold'],['The mess','mess'],['The gallery, where everyone gathers','gather'],['Lumen is waiting by the hold door','l2','','c_lumen,l1,v_ember,!l2'],['Lumen waits at the gallery window','l3','','c_lumen,l2,m3,!l3'],['Back to the star map','space']]],
talk_l:['Lumen','Lumen asks about the thing you carry, or once carried. <i>“Is it sad?”</i> Then, quieter: <i>“My mother says our shells remember the sun.”</i>',[['Say you think it is remembering','rl1','+l1,+l1a'],['Say you are not sure, and ask what Lumen thinks','rl1','+l1']]],
rl1:['Shells and sun','[[l1a?<i>“Remembering,”</i> says Lumen. <i>“That is better than sad.”</i>]][[!l1a?Lumen thinks very hard. <i>“I think it likes being carried.”</i>]] They fall asleep against the mantis, who does not move for an hour.',[['Back to the gallery','gather']]],
l2:['Soft','Lumen shows you a pale new shell on one arm, not yet hard. <i>“I am molting. I was proud of my hard shell. Now I am soft and everyone can see.”</i>',[['Tell them softness is not weakness','rl2','+l2,+l2a'],['Sit beside them while they are soft','rl2','+l2']]],
rl2:['Hardening','[[l2a?<i>“Then I will be soft on purpose, sometimes,”</i> says Lumen, with a brave small smile.]][[!l2a?You sit until the new shell begins to harden. They lean on you through the worst of it.]]',[['Back to the ship','ship']]],
l3:['A song for Seru','Lumen stands at the window. <i>“Seru is sad even when he laughs. There is a song from home, for the dead and the living at once. I only know half. Will you help me learn the rest?”</i>',[['Practice the song with Lumen','rl3','+l3,+l3a'],['Let Lumen sing it alone when ready','rl3','+l3']]],
rl3:['Half a song','[[l3a?You hum the low part until your throat is sore. Lumen laughs at every wrong note, and gets the song right.]][[!l3a?Lumen practices alone in the hold, and the plants seem to lean toward the sound.]] They think Seedfall is the place to sing it.',[['Back to the ship','ship']]],
seedfall:['Seedfall','A hillside of small green things in a silver dusk. Ahn-Teru’s seeds fell here and grew into a wild orchard of a hundred kinds of fruit. The mantis kneels at the first tree and does not rise for a long while.',[['Kneel beside him','sf2'],['Give him space and walk the rows','sf2'],['Let Lumen sing at the first tree','shellsong','','l3']]],
shellsong:['The shell-song','Lumen steps to the first tree and sings the old song, thin, clear and a little frightened. [[l3a?You hum beneath it, as you practiced.]] The mantis’s shoulders shake. The orchard blooms all at once, a hundred colors in silver dusk. <i>“Thank you,”</i> he says to Lumen, <i>“for bringing home to me.”</i>',[['Take a cutting','space','+i_cutting','!i_cutting'],['Stay among the blossoms','space']]],
glass:['Glass Moor','The ship settles on a plain of standing glass, each blade tall as a pine, ringing in the wind like a harp. Slow beings of glass drift between them, humming.',[['Walk among them','glass2'],['Let the gauntlet ring against a blade','glass2','+i_song','i_gaunt'],['Walk out to the broken dunes','dunes'],['Back to the stars','space']]],
dunes:['The broken dunes','Beyond the standing glass the plain breaks into dunes of glittering fragments where old Harpers lie shattered, still humming. Each shard holds a trace of song.',[['Mend a fallen Harper with your shard','dunes2','-i_shard','i_shard'],['Sit among them and listen','dunes3'],['Back','glass']]],
dunes2:['A word restored','The shard fits like a missing word. The Harper rings, rises and bows, and hums a phrase into your chest. [[c_sable?Sable hears it and writes it in the air with her fingers.]]',[['Back to the moor','glass','+i_song']]],
dunes3:['Broken songs','You sit among the broken songs. Nothing asks anything of you. When you rise you carry the sense that broken things are still singing.',[['Back to the moor','glass','+f_dunes']]],
brine3:['The deep','The leviathan carries the ship beneath the surface, lit from below by creatures like lanterns. It sings your name wrongly and warmly.',[['Let Pip sing to it','brine4','','c_pip,f_pipwish'],['Follow the lanterns to a drowned city','drowned'],['Stay silent in the glow','space']]],
drowned:['The Drowned Choir','A city of coral towers under the water, each pipe still singing as the tide moves. Maru, an old eel-like tide-keeper, shows you the Great Pipe, silent for a hundred years.',[['Draw the gauntlet’s blade lightly along it','drowned2','','i_gaunt'],['Ask Maru what the city remembers','drowned3'],['Back','brine3']]],
drowned2:['The pipe answers','The blade finds the note the pipe has been waiting for. The whole city answers, a thousand voices rising. Maru weeps salt. <i>“A hundred years of quiet, and you ended it gently.”</i>',[['Back to the deep','brine3','+f_choir']]],
drowned3:['What the city remembers','<i>“Everyone who ever left, and everyone who came back.”</i> Maru hums a lullaby, and you realize it is the one the mantis hums when he thinks no one is listening.',[['Back to the deep','brine3']]],
ember3:['The orchard keeper','A tall woman with bark for skin, Cinder, tends the trees. She sees the fruit in your hand. <i>“Warm things want to be shared.”</i>',[['Ask how the fire orchard grows','ember4'],['Walk the Cinder Marsh at night','marsh'],['Thank her and go','space']]],
marsh:['Cinder Marsh','Ash-moths drift over black water, lighting up as you pass. A fire-heron stands on one leg, watching.',[['Offer the ember fruit','marsh2','','i_ember'],['Sit and watch the moths','marsh3'],['Back','ember3']]],
marsh2:['The heron','The heron eats nothing. It presses its beak to the fruit and the fruit glows brighter. Then it drops one tail feather at your feet.',[['Take the feather','ember3','+i_feather','!i_feather']]],
marsh3:['Moths','The moths settle on your arms and shoulders, and for a moment you glow with them. The mantis laughs softly, the first true laugh you have heard from him.',[['Back to the orchard','ember3']]],
hollow_e:['Lanterns','The shore lights lanterns for the one who wore it. A young mantis, Lumen, tugs your sleeve. <i>“Can I see the stars with you?”</i>',[['Welcome Lumen aboard','hollow_e','+c_lumen','!c_lumen'],['Walk the amber shore','shore'],['Visit the amber library','hall'],['Sit by the elder’s fire','kin'],['Take to the stars again','space']]],
shore:['The amber shore','Children of Hollow Reach race along the shore, clicking with laughter. The game is leapfrog over a sleeping tide-turtle. Lumen watches, shy.',[['Join the game','shore2'],['Watch with Lumen','shore3'],['Back','hollow_e']]],
shore2:['Leapfrog','You leap and fall, to everyone’s delight. A child gives you a game-prize, a tiny moth held in amber, and bows with great seriousness.',[['Back to the shore','hollow_e','+i_amber','!i_amber']]],
shore3:['Beside Lumen','You sit with Lumen. After a while they run off to join, and you watch them become part of the game. The mantis sits beside you, saying nothing, wholly present.',[['Back to the shore','hollow_e']]],
lighthouse:['The lighthouse at nowhere','A white tower on a rock of ice, its lamp turning for no one. Wick, its keeper, a patient thing of brass and lantern-glass, waves. <i>“Ships so seldom come. Tea?”</i>',[['Have tea and hear its story','light2'],['Climb to the lamp-room','lamproom'],['Accept the lamp it offers','lighthouse','+i_lamp,+f_fen','!i_lamp'],['Leave','space']]],
lamproom:['The lamp-room','At the top the great lamp turns around a small chair worn smooth. A shelf holds letters addressed to “Whoever Needs This.”',[['Read one of the letters','letter'],['Sit in the chair and watch the dark','watch'],['Set the ember fruit in the lamp','bright','','i_ember'],['Back down','lighthouse']]],
letter:['A letter','It says only: <i>“You are not behind. You are not late. You are exactly as far as you have come.”</i> The ink is old and the handwriting is Wick’s, careful as a child’s.',[['Back to the lamp','lamproom','+f_letter']]],
watch:['Watching','You sit in the worn chair. After an hour a faint ship passes far off, and Wick waves on your behalf, delighted. <i>“First in forty years,”</i> it whispers. <i>“The lighthouse is working.”</i>',[['Back to the lamp','lamproom']]],
bright:['A warmer beam','You set the fruit in the lamp. The beam turns gold and reaches farther than any light has. Far away, something answers with a flash.',[['Back to the lamp','lamproom','-i_ember,+f_beacon']]],
comet:['The comet market','A comet trails a bazaar of stalls on silk cables. Brindle, a many-armed trader, rubs every hand together. <i>“I take stories, fruit or glass.”</i>',[['Tell Brindle the story of the gauntlet','story','','!i_mirror'],['Browse the stalls','stalls'],['Ask about the sparks in the tail','sparks'],['Tell Brindle about the golden beam','beacon','','f_beacon'],['Trade a shard for a harp','comet','-i_shard,+i_harp','i_shard'],['Leave','space']]],
stalls:['The stalls','Bottled first snows. A clock that runs backward only for grief. Kites strung from the tails of dreams. A jar labeled <i>“the sound of someone coming home.”</i> Brindle watches you, many hands folded.',[['Trade the heron feather for the jar','jar','-i_feather,+i_jar','i_feather'],['Trade the moth in amber for the jar','jar','-i_amber,+i_jar','i_amber'],['Browse on','comet']]],
jar:['The jar','You open it a crack. Far away a door opens, and a voice says your name gently. You close it fast, eyes wet. <i>“Open it only when you need it,”</i> says Brindle.',[['Back to the market','comet']]],
sparks:['Story-sparks','<i>“What is left when a story is told so often it catches fire.”</i> In the tail you hear snatches: a child in tall grass, a mantis walking home, a gardener giving a seed to a stranger.',[['Back to the market','comet']]],
beacon:['The beam','<i>“That light! I steer my whole market by it now.”</i> Brindle presses a handful of story-sparks into your palm, warm as bread.',[['Back to the market','comet','+i_sparks','!i_sparks']]],
fen:['Mirror Fen','Shallow silver water to the horizon, and every reflection is somewhere else. In the glass, a child with a browned gauntlet plays in tall grass, and does not see you.',[['Call to the child gently','fen2'],['Watch from a distance','fen3'],['Step through the water','fen4','','i_mirror'],['Throw the story-sparks across the silver','fen5','-i_sparks','i_sparks'],['Walk the reflections of those aboard','fen6','','f_forgiven'],['Leave the fen','space']]],
fen5:['The fen alight','The sparks scatter across the silver. Every reflection moves, laughs, remembers. For a moment you are all in the same story at once, and none of you is alone in it.',[['Back to the fen','fen']]],
fen6:['Those who came with you','The fen shows each of you as you were. [[c_tobin?Tobin, small, laughing, holding a gauntlet he was never given.]] [[c_pip?Pip poling a ferry she thought was the world.]] [[c_sable?Sable alone with her harp in an empty tent.]] [[c_orin?Orin planting flowers in a garrison without asking why.]] [[c_quill?Quill drawing a place that would be gone by morning.]] [[c_lumen?Lumen, hard-shelled and proud, not yet soft.]] The mantis stands very still, watching a gardener give a seed to a stranger.',[['Reach for your own reflection','fen7'],['Stand beside the mantis','fen8']]],
fen7:['Yourself','You and your younger self nod once. Nothing needs saying. The water ripples, and the reflection goes back to its game.',[['Back to the fen','fen']]],
fen8:['Beside him','<i>“I did not know I would see her,”</i> he says. <i>“Thank you for being here when I did.”</i> His hand rests next to yours, not quite touching, and that is enough.',[['Back to the fen','fen','+f_fen_seru']]],
lobby:['The dome','Doors open on a lobby of gold light: windows, restaurants, rooms for living. Through the glass, a great ship glides in and docks at the far arm.|<i>“Everything here is yours to wander,”</i> says the mantis.',[['The restaurant','diner'],['The sky garden','garden'],['The observatory','obs'],['The living quarters','rooms'],['The lantern bazaar','bazaar'],['The roof terrace','roof'],['The docking arm','dock'],['Ride back down','ground']],'ship'],
roof:['The roof','A wide terrace above the dome, wind-whipped, stars close. Banners snap. Someone has left a kite.',[['Fly the kite','kite'],['Sit at the edge and look down','edge_look'],['Back','lobby']]],
kite:['The kite','The kite goes up and up. Whatever you whisper to its string seems to reach someone. [[c_pip?Pip runs up and seizes the string, whooping.]] [[c_tobin?Tobin holds the spool, laughing, then goes serious: <i>“Is that my village?”</i>]]',[['Back to the roof','roof','+f_kite']]],
edge_look:['The world below','The plain, the river, the field of stones, the small glitter of the village. <i>“It looks very small,”</i> says the mantis, <i>“and very kind.”</i> You feel the pull of the stars and the pull of home, and neither wins.',[['Back to the roof','roof']]],
bazaar:['The lantern bazaar','A covered market on the ring road: paper lanterns by the thousand, stalls selling stories by weight. Hesper, a lantern-maker, paints each one by hand.',[['Commission a lantern for the one who wore the gauntlet','lantern','','!i_lantern'],['Ask Hesper about the dome','hist'],['Back','lobby']]],
lantern:['A lantern','Hesper paints a small gold mantis with a seed in her hands, and gives it to you lit. <i>“Whoever she was, she is being carried.”</i>',[['Back to the bazaar','bazaar','+i_lantern']]],
hist:['The dome’s story','<i>“The tower was built by people who wanted to be closer to the sky and could not stop climbing. Then they found the sky was kind and stayed. The escalators never stop because no one dares tell them to.”</i>',[['Back to the bazaar','bazaar']]],
ground:['The foot of the tower','A vast plain, and in its center the tower: a dome of windows, lobbies and homes propped on four colossal escalator legs that climb into the clouds. Below it stand a market, a river, an old well and a field of stones.|<i>“Go where you like,”</i> says the mantis. <i>“I’ll be here.”</i>',[['Visit Footfall Market','market'],['Walk down to the river','ferry'],['Visit the field of stones','cairn'],['Visit the old well','well'],['Go back for Tobin','fetch','','!c_tobin'],['✦ Ride the escalator','ride']],'tower'],
well:['The old well','A stone well with a rope worn bright. Villagers drop questions down, not coins. Once a year, they say, something at the bottom answers.',[['Drop a question down','well2'],['Just listen','well3'],['Back','ground']]],
well2:['The answer','[[f_forgiven?The well answers in your own voice: <i>“You were forgiven before you asked.”</i>]][[!f_forgiven?The well is silent a long while, then says: <i>“Not yet. But soon.”</i>]]',[['Back to the well','well']]],
well3:['Listening','Under the water: roots, bells, someone humming. For a moment you cannot tell which of it is yours.',[['Back to the well','well']]],
cairn:['The field of stones','Thousands of small cairns, each laid by someone for someone killed. Wind combs the grass. The mantis stops at the edge. <i>“Come as you wish.”</i>',[['Leave the gauntlet among the stones','left','-i_gaunt','i_gaunt'],['Hang the lantern at the edge','lantern_hung','-i_lantern','i_lantern'],['Sit with the mantis and add a stone','stone'],['Back to the plain','ground']]],
lantern_hung:['A light for her','You hang the lantern at the edge of the stones. By night the cairns glow gold, and the mantis lays his forearm along the grass and bows.',[['Back to the plain','ground']]],
home:['Earth below','Blue and small and yours. <i>“It is a good place to be from,”</i> says the mantis, <i>“and to come back to.”</i>',[['Open the jar of homecoming','jar_open','','i_jar'],['Land in your village','end_home'],['Land at the tower','lobby'],['Turn back to the stars','space']]],
jar_open:['Someone coming home','You open the jar. The sound of someone coming home fills the ship, a latch, a laugh, a kettle, and every companion looks up. Even the mantis closes his eyes. Earth turns below, glad.',[['Look down at Earth','home','-i_jar']]],
ship:['Inside the Long Patience','Warm corridors of pale ribbed wood hum with the engine’s slow heartbeat. Doors open wherever you want to go.',[['The bridge','bridge'],['The garden hold','hold'],['The mess','mess'],['The gallery, where everyone gathers','gather'],['The quiet alcove','quiet'],['Lumen is waiting by the hold door','l2','','c_lumen,l1,v_ember,!l2'],['Lumen waits at the gallery window','l3','','c_lumen,l2,m3,!l3'],['Back to the star map','space']]],
quiet:['The quiet alcove','A small alcove with a curved shelf of pale wood, shaped to a forearm. The ship hums softer here.',[['Rest the gauntlet on the shelf','quiet2','','i_gaunt'],['Sit with the shelf as it is','quiet3'],['Back','ship']]],
quiet2:['Resting','The gauntlet rests. In the stillness it seems to sigh, and you feel the weight of the one who wore it, and of everyone who has carried it since. It is a heavy weight, and a kind one. You take it up again feeling known by it.',[['Back to the ship','ship','+f_rested']]],
quiet3:['Sitting','You sit with the shelf. [[!i_gaunt?Without the gauntlet you feel lighter, and are surprised to feel it.]][[i_gaunt?You keep the gauntlet on your arm, and the shelf waits.]] The mantis sits beside you a while, then simply stays.',[['Back to the ship','ship']]],
ferry:['The ferry','Pip, a child no older than you once were, poles a ferry across the slow river. <i>“Nobody goes up there,”</i> she says, nodding at the tower. <i>“They say you can see the stars from the top.”</i>',[['Invite Pip along','ground','+c_pip','!c_pip'],['Ride across and back with her','ferry2'],['Cut a new pole from the reeds with the gauntlet','pole','','i_gaunt'],['Back to the plain','ground']]],
pole:['A new pole','The blade parts the reeds as it did when you were small, and hums contentedly. You carve Pip a new pole, and she grips it, shining. [[c_pip?She tests it at once, spinning.]]',[['Back to the river','ferry']]],
return_stone:['A stone for Ahn-Teru','In the field of stones you find a bare patch and lay a stone there, with a seed if you have one. [[i_grain?You scatter Ines’s grain beside it.]] The mantis says a shoot will come by morning. He is right.',[['Back to the village','end_home']]],
end_home:['Home','The ship settles in the square where you grew up. Villagers gather. Ines hands you a warm loaf, as if no time has passed. {crew} are welcomed and fed, and the mantis stands among them, unhurried.',[['Walk to the village square','square'],['Visit Ines at the bakery','bakery2'],['Visit the mill','mill2'],['Climb to your old room','attic'],['Walk out to the lantern field','landing_field','','t3'],['Visit the field of stones','return_stone','','f_ahn'],['Sit with Tobin and Ines at the table','table'],['Go out again','space'],['Stay','end_stay']]],
square:['The village square','The whole village has gathered. Children touch the ship’s hull. The mantis sits on the well’s edge and lets them stare.',[['Sable plays for the village','sable_sq','','c_sable'],['Orin asks to plant something','orin_sq','','c_orin'],['Quill unrolls a long scroll','quill_sq','','c_quill'],['Pip goes down to the river','pip_sq','','c_pip'],['Lumen meets the village children','lumen_sq','','c_lumen'],['Back','end_home']]],
sable_sq:['The square dances','Sable sets her harp on the well’s edge. [[f_concert?She plays the whole song, finished, and the square goes quiet, then rises into a dance.]][[!f_concert?She plays what she has, unfinished, and an old man hums the missing part from memory. Together they find it.]] Even Dorrit leaves the mill.',[['Back to the square','square']]],
orin_sq:['Orin plants','Orin kneels in a corner of the square and asks permission of the earth. [[i_graft?He sets the grafted sprig, and the cobbles seem to loosen to make room.]][[!i_graft?He plants a modest bed of herbs, and Ines sends a boy for water.]] By evening something green is there that was not.',[['Back to the square','square']]],
quill_sq:['A map of home','Quill draws the village on a long scroll, every door and bend. <i>“I have mapped a hundred worlds and never a place where someone put out bread for me.”</i> They add a small mark by the bakery: <i>“here.”</i>',[['Back to the square','square']]],
pip_sq:['The ferry again','Pip returns to the river and her uncle looks at her for a long time. [[p2a?<i>“Knowing the door is open, I came to say I am choosing to stay a while, and to go again.”</i>]][[!p2a?<i>“I decide every day,”</i> she says. <i>“Today I came to say hello.”</i>]] He says nothing, and ferries her across twice, for free.',[['Back to the square','square']]],
lumen_sq:['A soft friend','A village child asks why Lumen’s arm looks so strange. Lumen holds out the pale new shell. <i>“It is soft. It is mine.”</i> The child holds out a scabbed knee, and the two sit comparing wounds, delighted.',[['Back to the square','square']]],
bakery2:['Ines, again','Ines looks at the mantis a long time, then offers him a seat and a loaf. <i>“You look like you could use both.”</i> [[f_ahn?You tell her about Ahn-Teru and the seeds. She goes to the pantry and returns with a handful of grain. <i>“Plant it with hers.”</i>]]',[['Accept the grain','end_home','+i_grain','f_ahn,!i_grain'],['Back','end_home']]],
mill2:['The mill, again','Dorrit wipes flour from her hands. <i>“The peddler who sold your mother that thing came back once, years later, thin as a nail. He asked if the child who had it was happy. I said yes. He wept and left a sack of seed on the step.”</i> [[c_mantis?The mantis stands very still.]]',[['Ask where the seed went','mill3'],['Back','end_home']]],
mill3:['Behind the mill','Dorrit shows you a patch behind the mill: a wild garden of a hundred kinds of green. <i>“It grows itself. I never planted a thing.”</i> The mantis kneels and touches the earth, and does not say what he feels.',[['Kneel beside him','end_home','+f_peddler']]],
attic:['Your old room','Under the eaves your bed is smaller than you remember. On the wall hangs a drawing you made as a child: a tall green-gold figure in a doorway, wearing a gauntlet like yours. You do not remember drawing it. [[c_mantis?The mantis studies it. <i>“A good likeness,”</i> he says. <i>“Perhaps you saw me coming.”</i>]]',[['Take the drawing','end_home','+i_drawing','!i_drawing'],['Leave it on the wall','end_home']]],
space:['The star map','Stars drift past the windows. The mantis spreads the map and waits.',[['✦ Glass Moor','glass','+v_glass'],['The Brine Choir','brine','+v_brine'],['Ember Orchard','ember','+v_ember'],['Hollow Reach, where the mantis was born','hollow','+v_hollow','i_chart'],['Mirror Fen','fen','+v_fen','f_fen'],['Seedfall','seedfall','','m3'],['The Blank','edge','','q3'],['Glass Moor, a second visit','glassb','','v_glass,f_concert'],['The Brine Choir, a second visit','brineb','','v_brine,p2'],['Ember Orchard, a second visit','emberb','','v_ember,i_graft'],['Hollow Reach, a second visit','hollowb','','v_hollow,m3'],['Walk the ship','ship'],['Drift between the stars','drift'],['Return to Earth','home']]],
glassb:['The Harpers’ festival','The standing glass is hung with lanterns. [[f_concert?Word of Sable’s concert has crossed the plain as a ringing in the wind.]] A Harper bows and offers a seat in the circle.',[['Join the circle','glassb2'],['Ask about the broken dunes','glassb3','','f_dunes'],['Back to the stars','space']]],
glassb2:['The circle','The Harpers hum a long chord and wait for each guest to add a voice. [[c_sable?Sable takes up her harp and finds the missing third.]] [[c_pip?Pip gets the giggles and adds a bell-like squeak the Harpers adore.]] [[i_gaunt?The gauntlet’s blade rings a note no glass has heard in years.]] You add your terrible voice. They call it brave.',[['Back to the stars','space','+f_festival']]],
glassb3:['The dunes mended','The broken Harpers stand again, scattered through the dunes, humming in rising and falling tones. One bends to you. <i>“We remembered because you listened.”</i>',[['Accept a shard of their first song','space','+i_shard','!i_shard'],['Bow and go','space']]],
brineb:['The tide returns','The ocean sings in two voices now: the old choir and a smaller, sharper one. [[c_pip?Pip leans from the port. <i>“It knows my name.”</i>]] The leviathan surfaces, vast and gentle, and waits.',[['Let Pip decide','brineb2','','c_pip'],['Ask the leviathan what it wants','brineb3'],['Back to the stars','space']]],
brineb2:['Pip’s choice','The leviathan offers to carry the ship across the singing sea to places no map holds. Pip hesitates. [[p2a?<i>“Knowing the door is open,”</i> she says, <i>“I want to see.”</i>]][[!p2a?<i>“I decide again today,”</i> she says, <i>“and I say yes.”</i>]] The ship rides the swell for an hour, and the choir sings the whole way.',[['Back to the stars','space','+f_swell']]],
brineb3:['What it wants','It sings a question about what you hold, or what you left behind. [[i_gaunt?You raise the gauntlet and the leviathan hums low and long: a lullaby for the dead.]][[!i_gaunt?You tell it about the stones. It sings a lullaby for them, and the sea goes quiet to listen.]]',[['Back to the stars','space']]],
emberb:['The orchard in bloom','The black glass is green now. The trees have grown thick and gold, and Cinder waits at the edge. [[i_graft?She sniffs the grafted sprig and nods. <i>“It carries a little of everyone it has met.”</i>]] She points to a small clearing.',[['Plant a seed in the clearing','emberb2','-i_seed','i_seed'],['Plant the grafted sprig in the clearing','emberb3','','i_graft'],['Walk among the trees','emberb4'],['Back to the stars','space']]],
emberb2:['A small beginning','The seed takes at once, and Cinder laughs, a crackling sound. <i>“Fire likes a small beginning.”</i>',[['Back to the orchard','emberb','+f_ember_seed']]],
emberb3:['The grove','The sprig takes root and the clearing blazes gold; it will bear fruit that warms and does not burn. Cinder presses a hand to your shoulder. <i>“Come back when it fruits.”</i>',[['Back to the orchard','emberb','+f_ember_grove']]],
emberb4:['The golden trees','Each fruit holds a small, steady light. The mantis plucks one, studies it, and shares it with [[c_lumen?Lumen, who says it tastes like sunlight remembered.]][[!c_lumen?you. It tastes like a warm room you have been in before.]]',[['Back to the orchard','emberb']]],
hollowb:['The homecoming','The shore is lit as before, but now every mantis is waiting for him, not for you. He climbs the amber stairs with a cutting from Seedfall in his hand. [[l3?Lumen walks beside him, singing the half-song under their breath.]]',[['Walk up with him','hollowb2'],['Wait on the shore with the children','hollowb3'],['Back to the stars','space']]],
hollowb2:['The planting','At the top the elder waits. He kneels and sets the cutting in a bed of amber soil. <i>“This is hers. I carried her seeds. I have carried them long enough.”</i> The elder lays a hand on his and says nothing.',[['Back to the stars','space','+f_planted_home']]],
hollowb3:['The shore','You sit with the children while the grown ones are above. They teach you their clicking words: “home” is the sound of two shells touched together. When he returns you can say it badly, and he laughs.',[['Back to the stars','space','+f_clicks']]],
end_home:['Home','The ship settles in the square where you grew up. Villagers gather. Ines hands you a warm loaf, as if no time has passed. {crew} are welcomed and fed, and the mantis stands among them, unhurried.',[['Find the mantis','mantis_e','','c_mantis'],['Walk to the village square','square'],['Visit Ines at the bakery','bakery2'],['Visit the mill','mill2'],['Climb to your old room','attic'],['Walk out to the lantern field','landing_field','','t3'],['Visit the field of stones','return_stone','','f_ahn'],['Sit with Tobin and Ines at the table','table'],['Go out again','space'],['Stay','end_stay']]],
mantis_e:['Where is he?','The mantis has slipped away from the square, as he does when too many people look at him kindly.',[['Follow him to the field of stones','m_stones'],['Find him with the children','m_children'],['Sit with him on Ines’s step','m_step'],['Ask what he wants now','m_want'],['Back','end_home']]],
m_stones:['Dusk at the stones','He stands among the cairns, not speaking. [[f_ahn?He lays a small stone and a seed on the bare patch where you laid yours.]] When he turns, his face is wet. <i>“I thought grief would feel like an ending. It feels like a place I live.”</i>',[['Back','mantis_e']]],
m_children:['Listening lessons','He sits cross-legged by the well, children ringed around. <i>“Press your palm to the stone. Tell me what you feel.”</i> A child says: <i>“Humming.”</i> He is delighted. <i>“Yes. Everything hums if you let it.”</i> Even Dorrit stops by, hands in her apron.',[['Back','mantis_e']]],
m_step:['Ines’s step','He and Ines sit side by side with bread and no common words. She tears the loaf and gives him the heel. He tears it and gives her the best part. They laugh at the same moment. [[f_peddler?He glances once toward the mill and says nothing, and Ines pretends not to see.]]',[['Back','mantis_e']]],
m_want:['What he wants','You ask. He takes a long time. <i>“I did not expect to love a village.”</i> [[m3?<i>“I did not expect to forgive a road.”</i>]] [[l3?<i>“I did not expect to be sung to.”</i>]] [[f_fen_seru?<i>“I did not expect to be seen by someone who came with me.”</i>]] He looks at you. <i>“I would like to go on with you, and to come back here again and again. Both. Is that too greedy?”</i>',[['Say it is the opposite of greedy','m_end','+f_both'],['Say you want both too','m_end','+f_both']]],
m_end:['Both','He bows, shell to shell, as he has bowed to no one else. Earth under your feet, stars over your head, the two of you between. <i>“Then let us live in both.”</i>',[['Back to the village','end_home']]]
};

 if(k==='start')S=new Set(['i_gaunt']);

 const crew=J(['you',...Object.keys(N).filter(f=>f[0]==='c'&&S.has(f)).map(f=>N[f])]);
 el.innerHTML='<h2>'+t+'</h2>'+(g?'<pre class="glyph" aria-hidden="true">'+G[g]+'</pre>':'')+x.split('|').map(p=>'<p>'+p.replace('{crew}',crew).replace(/\[\[(!?)(\w+)\?(.*?)\]\]/g,(m,n,f,t)=>(S.has(f)!==!!n)?t:'')+'</p>').join('')+'<div class="choices"></div>';
 const box=el.querySelector('.choices');
 ch.forEach(([l,to,fx,c])=>{
  if(c&&!c.split(',').every(z=>z[0]==='!'?!S.has(z.slice(1)):S.has(z)))return;
  const b=document.createElement('button');b.textContent=l;

 const L=p=>{const a=Object.keys(N).filter(f=>f[0]===p&&S.has(f)).map(f=>N[f]);return a.length?a.join(', '):'nothing yet'};

 window.scrollTo({top:0,behavior:'smooth'});
